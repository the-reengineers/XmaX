<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for org.xmax.Service.
  Requires: root may own the name; everyone may call it and read its signals.
  Install to: /usr/share/dbus-1/system.d/org.xmax.Service.conf
-->
<busconfig>
  <policy user="root">
    <allow own="org.xmax.Service"/>
  </policy>

  <policy context="default">
    <!-- Standard D-Bus interfaces (always needed) -->
    <allow send_destination="org.xmax.Service"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_type="method_call"/>
    <allow send_destination="org.xmax.Service"
           send_interface="org.freedesktop.DBus.Properties"
           send_type="method_call"/>
    <allow send_destination="org.xmax.Service"
           send_interface="org.freedesktop.DBus.Peer"
           send_type="method_call"/>

    <!-- Our service interface — all methods -->
    <allow send_destination="org.xmax.Service"
           send_interface="org.xmax.Service"
           send_type="method_call"/>

    <!-- Allow signals from our service -->
    <allow receive_sender="org.xmax.Service"
           send_type="signal"/>
  </policy>
</busconfig>